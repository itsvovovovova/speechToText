services:
  rabbitmq:
    image: rabbitmq:3.12-management
    env_file:
      - .env
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    hostname: rabbitmq
    ports:
      - "${RABBITMQ_PORT}:5672"
      - "${RABBITMQ_USER_PORT}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:15
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: database
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
    env_file:
      - .env
    environment:
      - DB_HOST=postgres
      - DB_MIGRATION_PATH=file:///app/src/db/migration
      - REDIS_HOST=redis:6379
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
    ports:
      - "${SERVER_PORT}:${SERVER_PORT}"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:${SERVER_PORT}/ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    build: .
    command: ["/dockerproject", "worker"]
    env_file: .env
    environment:
      DB_HOST: postgres
      DB_MIGRATION_PATH: file:///app/src/db/migration
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    depends_on:
      server:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8081/ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  tests:
    build:
      context: .
      target: test
    env_file:
      - .env
    environment:
      - STT_INTEGRATION=1
      - DB_HOST=postgres
      - DB_MIGRATION_PATH=file:///app/src/db/migration
      - REDIS_HOST=redis:6379
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/alerts.yml:/etc/prometheus/alerts.yml:ro

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/etc/grafana/dashboards:ro

volumes:
  grafana-storage:
  rabbitmq_data:
  postgres_data:
